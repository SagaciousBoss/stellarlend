name: cargo-check

on:
  push:
    paths:
      - 'turbo.json'
      - 'scripts/cargo-check.sh'
      - 'scripts/__tests__/cargo-check.test.mjs'
      - 'package.json'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - 'turbo.json'
      - 'scripts/cargo-check.sh'
      - 'scripts/__tests__/cargo-check.test.mjs'
      - 'package.json'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test cargo-check script with a fake cargo
        run: node --test scripts/__tests__/cargo-check.test.mjs
      - name: Verify turbo task graph
        run: npx --yes turbo@2 run cargo-check --dry=json > /tmp/turbo-graph.json
      - name: Check the standalone Rust crates
        run: >-
          bash scripts/cargo-check.sh
          --workspace contracts/oracle
          --workspace contracts/liquidation
          --workspace contracts/pool_math
      - name: Oracle staleness and liquidation checks tests
        run: |
          cargo test --manifest-path contracts/oracle/Cargo.toml
          cargo test --manifest-path contracts/liquidation/Cargo.toml
      - name: Upload check summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-summary
          path: .turbo/cargo-check/last-run.json
          if-no-files-found: ignore
